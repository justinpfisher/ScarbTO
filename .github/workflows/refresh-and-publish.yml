name: Validate, refresh DineSafe and publish

on:
  schedule:
    - cron: '17 10 * * *'  # Once daily, UTC. Not a real-time inspection feed.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'research/**'
      - '.github/scripts/test_research_prototypes.py'
      - '.github/workflows/refresh-and-publish.yml'

concurrency:
  group: scarbto-pages
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - scarbto-gmktec
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        shell: >-
          powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned
          -Command "$ErrorActionPreference = 'Stop'; . '{0}'; if (Test-Path -LiteralPath variable:\LASTEXITCODE) { exit $LASTEXITCODE }"
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled Python 3.12
        run: |
          $python = 'C:\Program Files\Python312\python.exe'
          if (-not (Test-Path -LiteralPath $python)) {
            throw 'The approved GMKtec Python 3.12 installation is unavailable.'
          }
          & $python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Path $python) -Encoding ASCII
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned browser-test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium for rendered regression tests
        run: npx playwright install chromium
      - name: Unit tests (network-independent)
        run: python -m unittest discover -s tests -v
      - name: Check production smoke-check script syntax
        run: python -m py_compile scripts/verify_live_overlay.py
      - name: Check JavaScript syntax
        run: |
          $files = @(
            'docs/logic.mjs',
            'docs/area-selection.mjs',
            'docs/area-explorer.mjs',
            'docs/app.mjs',
            'docs/beach-history.mjs',
            'docs/selected-calls.mjs'
          )
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
      - name: JavaScript logic tests
        run: node --test tests/logic.test.mjs tests/list-focus.test.mjs tests/app-render.test.mjs tests/boundary.test.mjs tests/area-selection.test.mjs
      - name: Offline research prototype tests
        run: python .github/scripts/test_research_prototypes.py
      - name: Beach sample view tests
        run: node tests/beach-history.test.mjs
      - name: Rendered desktop and mobile browser tests
        run: node --test tests/browser.integration.test.mjs
      - name: Upload rendered regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scarbto-rendered-browser-screenshots
          path: test-results/beach-browser/*.png
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write  # Persist validated snapshot and 365-day activity window.
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and validate official Toronto data
        run: python scripts/update_dinesafe.py
      - name: Validate output is public and usable
        run: python scripts/verify_snapshot.py
      - name: Persist only validated data and recoverable release baseline
        run: |
          git config user.name "Scarb.TO data publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh validated Scarborough DineSafe snapshot"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy last validated snapshot
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify Scarb.TO production HTTP response and official boundary assets
        run: python scripts/verify_live_overlay.py "${{ github.sha }}"

